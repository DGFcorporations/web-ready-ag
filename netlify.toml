[build]
  command = "npm run build"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Static assets served directly by Netlify CDN
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# API routes go through the Hono serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# AEO routes go through the serverless function
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/llms.txt"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/llms-full.txt"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/ai.txt"
  to = "/.netlify/functions/api"
  status = 200

# SPA fallback — all other routes go through the serverless function
# (which serves index.html with injected meta for HTML requests)
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
